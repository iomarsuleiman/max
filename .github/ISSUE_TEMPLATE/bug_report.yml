name: Bug report
description: Report an application bug (not a security vulnerability)
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not disclose security vulnerabilities here. Follow SECURITY.md."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / OS / commit
