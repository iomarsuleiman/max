name: CI

on:
  push:
    branches: [main, max-2.0]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:backup
      - run: pnpm build
        env:
          MAX_LOCAL_MODE: "true"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level high
        continue-on-error: true

  # The experiments/ spikes (PR15–PR23) are not shipped code. Their suites still run locally:
  #   cd experiments/max-v2-pr18 && npm install && npm test   (see each folder's README)
  # They're kept out of CI so every push doesn't install browsers five extra times.

  # PR44: green means release remains blocked until separately reviewed.
  # This check does not attest to evidence, approve deployment or enable a flag.
  max-v2-release-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/release/max-v2-release-readiness.test.mjs
      - run: node scripts/max-v2-release-readiness.mjs --verify-locked
